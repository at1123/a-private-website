<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>VAULT — Private Screening Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=DM+Mono:wght@300;400&family=Syne:wght@400;700;800&display=swap" rel="stylesheet"/>

<style>
:root {
  --bg: #070709;
  --surface: #0f0f13;
  --surface2: #16161c;
  --border: rgba(255,255,255,0.07);
  --gold: #c9a84c;
  --gold-light: #e8c97a;
  --gold-dim: rgba(201,168,76,0.15);
  --text: #f0ede8;
  --text-dim: rgba(240,237,232,0.45);
  --text-muted: rgba(240,237,232,0.25);
  --red: #e05555;
  --radius: 4px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Mono', monospace;
  font-size: 13px;
  overflow-x: hidden;
}

/* ── GRAIN OVERLAY ─────────────────────────── */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 9999;
  opacity: 0.35;
}

/* ── SCROLLBAR ─────────────────────────────── */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: rgba(201,168,76,0.3); border-radius: 2px; }

/* ── LOGIN SCREEN ──────────────────────────── */
#login-screen {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 24px;
  position: relative;
}

.login-bg {
  position: fixed;
  inset: 0;
  background: radial-gradient(ellipse 60% 60% at 50% 40%, rgba(201,168,76,0.04) 0%, transparent 70%);
  pointer-events: none;
}

.login-card {
  width: 100%;
  max-width: 400px;
  position: relative;
  animation: fadeUp 0.8s cubic-bezier(.16,1,.3,1) both;
}

.login-eyebrow {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.login-eyebrow::before, .login-eyebrow::after {
  content: '';
  flex: 1;
  height: 1px;
  background: linear-gradient(to right, transparent, rgba(201,168,76,0.4));
}
.login-eyebrow::after {
  background: linear-gradient(to left, transparent, rgba(201,168,76,0.4));
}

.login-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 54px;
  font-weight: 300;
  letter-spacing: 0.12em;
  text-align: center;
  line-height: 1;
  margin-bottom: 6px;
  background: linear-gradient(135deg, #e8c97a 0%, #c9a84c 50%, #a07d2e 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.login-sub {
  text-align: center;
  color: var(--text-muted);
  font-size: 11px;
  letter-spacing: 0.1em;
  margin-bottom: 40px;
}

.form-field {
  margin-bottom: 16px;
}
.form-field label {
  display: block;
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-bottom: 8px;
}
.form-field input {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  color: var(--text);
  font-family: 'DM Mono', monospace;
  font-size: 13px;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.form-field input:focus {
  border-color: rgba(201,168,76,0.5);
  box-shadow: 0 0 0 3px rgba(201,168,76,0.07);
}

.btn-primary {
  width: 100%;
  background: linear-gradient(135deg, #c9a84c, #a07d2e);
  border: none;
  border-radius: var(--radius);
  padding: 14px 24px;
  color: #0a0800;
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  cursor: pointer;
  font-weight: 400;
  margin-top: 8px;
  transition: opacity 0.2s, transform 0.15s;
  position: relative;
  overflow: hidden;
}
.btn-primary:hover { opacity: 0.88; }
.btn-primary:active { transform: scale(0.99); }
.btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }

.error-msg {
  background: rgba(224,85,85,0.1);
  border: 1px solid rgba(224,85,85,0.3);
  border-radius: var(--radius);
  padding: 10px 14px;
  color: var(--red);
  font-size: 11px;
  margin-top: 14px;
  display: none;
}
.error-msg.show { display: block; }

/* ── APP SHELL ─────────────────────────────── */
#app-screen {
  display: none;
  min-height: 100vh;
  flex-direction: column;
}
#app-screen.active { display: flex; }

/* ── TOPBAR ────────────────────────────────── */
.topbar {
  height: 60px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 28px;
  position: sticky;
  top: 0;
  background: rgba(7,7,9,0.9);
  backdrop-filter: blur(20px);
  z-index: 100;
  gap: 20px;
}

.topbar-logo {
  font-family: 'Cormorant Garamond', serif;
  font-size: 22px;
  font-weight: 300;
  letter-spacing: 0.28em;
  background: linear-gradient(135deg, #e8c97a, #c9a84c);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-right: auto;
}

.topbar-count {
  font-size: 11px;
  color: var(--text-muted);
  letter-spacing: 0.08em;
}

.topbar-email {
  font-size: 11px;
  color: var(--text-dim);
  max-width: 180px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.btn-icon {
  width: 36px;
  height: 36px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-dim);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  flex-shrink: 0;
}
.btn-icon:hover { border-color: rgba(201,168,76,0.4); color: var(--gold); }
.btn-icon svg { width: 15px; height: 15px; }

.btn-add {
  height: 36px;
  padding: 0 16px;
  border-radius: var(--radius);
  border: 1px solid rgba(201,168,76,0.4);
  background: var(--gold-dim);
  color: var(--gold-light);
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: all 0.2s;
  white-space: nowrap;
}
.btn-add:hover { background: rgba(201,168,76,0.22); border-color: var(--gold); }
.btn-add svg { width: 13px; height: 13px; }

/* ── MAIN CONTENT ──────────────────────────── */
.main {
  flex: 1;
  padding: 36px 28px;
  max-width: 1400px;
  width: 100%;
  margin: 0 auto;
}

.section-header {
  display: flex;
  align-items: baseline;
  gap: 14px;
  margin-bottom: 28px;
}
.section-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 28px;
  font-weight: 300;
  letter-spacing: 0.06em;
  color: var(--text);
}
.section-title em {
  font-style: italic;
  color: var(--gold);
}
.section-line {
  flex: 1;
  height: 1px;
  background: var(--border);
}

/* ── SEARCH BAR ────────────────────────────── */
.search-wrap {
  margin-bottom: 28px;
  position: relative;
}
.search-wrap svg {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
  width: 14px;
  height: 14px;
  pointer-events: none;
}
.search-input {
  width: 100%;
  max-width: 360px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 11px 14px 11px 40px;
  color: var(--text);
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  outline: none;
  transition: border-color 0.2s;
}
.search-input:focus { border-color: rgba(201,168,76,0.4); }
.search-input::placeholder { color: var(--text-muted); }

/* ── VIDEO GRID ────────────────────────────── */
.video-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 20px;
}

.video-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  overflow: hidden;
  cursor: pointer;
  transition: all 0.25s cubic-bezier(.16,1,.3,1);
  animation: fadeUp 0.5s cubic-bezier(.16,1,.3,1) both;
  position: relative;
  group: true;
}
.video-card:hover {
  border-color: rgba(201,168,76,0.3);
  transform: translateY(-3px);
  box-shadow: 0 16px 48px rgba(0,0,0,0.5), 0 0 0 1px rgba(201,168,76,0.1);
}

.card-thumb {
  position: relative;
  aspect-ratio: 16/9;
  background: var(--surface2);
  overflow: hidden;
}
.card-thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.4s ease;
}
.video-card:hover .card-thumb img { transform: scale(1.04); }

.card-thumb-fallback {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  background: linear-gradient(135deg, var(--surface2), rgba(201,168,76,0.04));
}
.card-thumb-fallback .icon-play-big {
  width: 40px;
  height: 40px;
  color: var(--gold-dim);
}
.card-thumb-fallback span {
  font-size: 10px;
  color: var(--text-muted);
  letter-spacing: 0.1em;
}

.card-play-overlay {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.5);
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity 0.2s;
}
.video-card:hover .card-play-overlay { opacity: 1; }
.play-btn-circle {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: rgba(201,168,76,0.9);
  display: flex;
  align-items: center;
  justify-content: center;
  transform: scale(0.8);
  transition: transform 0.2s;
}
.video-card:hover .play-btn-circle { transform: scale(1); }
.play-btn-circle svg { width: 18px; height: 18px; color: #000; margin-left: 2px; }

.card-source-badge {
  position: absolute;
  top: 10px;
  left: 10px;
  background: rgba(0,0,0,0.75);
  border-radius: 3px;
  padding: 3px 8px;
  font-size: 9px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--gold);
  backdrop-filter: blur(8px);
}

.card-body {
  padding: 14px 16px 16px;
}
.card-title {
  font-family: 'Syne', sans-serif;
  font-size: 14px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 6px;
  line-height: 1.3;
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}
.card-url {
  font-size: 10px;
  color: var(--text-muted);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  letter-spacing: 0.04em;
}
.card-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--border);
}
.card-date {
  font-size: 10px;
  color: var(--text-muted);
  letter-spacing: 0.06em;
}
.card-actions {
  display: flex;
  gap: 6px;
}
.card-btn {
  width: 28px;
  height: 28px;
  border-radius: 3px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
}
.card-btn:hover { border-color: var(--border); color: var(--text-dim); background: var(--surface2); }
.card-btn.delete:hover { border-color: rgba(224,85,85,0.3); color: var(--red); }
.card-btn svg { width: 13px; height: 13px; }

/* ── EMPTY STATE ───────────────────────────── */
.empty-state {
  grid-column: 1 / -1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 80px 20px;
  text-align: center;
  gap: 16px;
}
.empty-icon {
  width: 64px;
  height: 64px;
  color: rgba(201,168,76,0.2);
}
.empty-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 24px;
  font-weight: 300;
  color: var(--text-dim);
}
.empty-sub {
  font-size: 11px;
  color: var(--text-muted);
  max-width: 280px;
  line-height: 1.7;
}

/* ── MODAL ─────────────────────────────────── */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  backdrop-filter: blur(12px);
  z-index: 500;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s;
}
.modal-overlay.open { opacity: 1; pointer-events: all; }

.modal {
  background: var(--surface);
  border: 1px solid rgba(201,168,76,0.2);
  border-radius: 8px;
  width: 100%;
  max-width: 500px;
  padding: 32px;
  transform: translateY(20px) scale(0.97);
  transition: transform 0.3s cubic-bezier(.16,1,.3,1);
  position: relative;
}
.modal-overlay.open .modal { transform: none; }

.modal-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 26px;
  font-weight: 300;
  letter-spacing: 0.08em;
  margin-bottom: 6px;
}
.modal-sub {
  font-size: 11px;
  color: var(--text-muted);
  margin-bottom: 28px;
  letter-spacing: 0.06em;
  line-height: 1.6;
}

.modal-close {
  position: absolute;
  top: 20px;
  right: 20px;
  width: 32px;
  height: 32px;
  border-radius: 3px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
}
.modal-close:hover { color: var(--text); border-color: rgba(255,255,255,0.15); }
.modal-close svg { width: 14px; height: 14px; }

.url-preview {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 14px;
  margin-top: -4px;
  margin-bottom: 16px;
  display: none;
  gap: 10px;
  align-items: center;
}
.url-preview.show { display: flex; }
.url-preview-icon {
  width: 32px;
  height: 32px;
  border-radius: 3px;
  background: var(--gold-dim);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.url-preview-icon svg { width: 14px; height: 14px; color: var(--gold); }
.url-preview-text { font-size: 11px; }
.url-preview-type { color: var(--gold); text-transform: uppercase; letter-spacing: 0.1em; font-size: 10px; }
.url-preview-domain { color: var(--text-dim); margin-top: 2px; }

.modal-footer {
  display: flex;
  gap: 10px;
  margin-top: 24px;
}
.btn-secondary {
  flex: 1;
  height: 42px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-dim);
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.15s;
}
.btn-secondary:hover { border-color: rgba(255,255,255,0.2); color: var(--text); }
.modal-footer .btn-primary { flex: 2; height: 42px; margin-top: 0; width: auto; }

/* ── PLAYER MODAL ──────────────────────────── */
.player-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.96);
  z-index: 600;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
}
.player-overlay.open { opacity: 1; pointer-events: all; }

.player-header {
  width: 100%;
  max-width: 960px;
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 16px;
}
.player-title-wrap { flex: 1; min-width: 0; }
.player-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 22px;
  font-weight: 300;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.player-source {
  font-size: 10px;
  color: var(--text-muted);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-top: 2px;
}
.player-close {
  width: 40px;
  height: 40px;
  border-radius: var(--radius);
  border: 1px solid rgba(255,255,255,0.1);
  background: rgba(255,255,255,0.04);
  color: var(--text-dim);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
  flex-shrink: 0;
}
.player-close:hover { border-color: rgba(224,85,85,0.4); color: var(--red); }
.player-close svg { width: 16px; height: 16px; }

.player-box {
  width: 100%;
  max-width: 960px;
  aspect-ratio: 16/9;
  background: #000;
  border-radius: 6px;
  overflow: hidden;
  position: relative;
  box-shadow: 0 40px 120px rgba(0,0,0,0.8);
}
.player-box iframe,
.player-box video {
  width: 100%;
  height: 100%;
  border: none;
  display: block;
}

.player-error {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  background: var(--surface2);
  color: var(--text-dim);
  font-size: 12px;
  text-align: center;
  padding: 20px;
}

/* ── LOADING ───────────────────────────────── */
.spinner {
  width: 20px;
  height: 20px;
  border: 2px solid rgba(201,168,76,0.2);
  border-top-color: var(--gold);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  display: inline-block;
}

/* ── TOAST ─────────────────────────────────── */
.toast {
  position: fixed;
  bottom: 28px;
  right: 28px;
  background: var(--surface2);
  border: 1px solid rgba(201,168,76,0.25);
  border-radius: var(--radius);
  padding: 12px 18px;
  font-size: 12px;
  color: var(--text);
  z-index: 9000;
  transform: translateY(80px);
  opacity: 0;
  transition: all 0.3s cubic-bezier(.16,1,.3,1);
  max-width: 300px;
}
.toast.show { transform: translateY(0); opacity: 1; }
.toast.success { border-color: rgba(80,200,120,0.3); color: #6ee09a; }
.toast.error { border-color: rgba(224,85,85,0.3); color: var(--red); }

/* ── ANIMATIONS ────────────────────────────── */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(18px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes spin {
  to { transform: rotate(360deg); }
}

/* ── RESPONSIVE ────────────────────────────── */
@media (max-width: 600px) {
  .topbar { padding: 0 16px; }
  .main { padding: 24px 16px; }
  .topbar-email { display: none; }
  .topbar-count { display: none; }
  .video-grid { grid-template-columns: 1fr; }
  .modal { padding: 24px 20px; }
  .player-overlay { padding: 12px; }
}
</style>
</head>
<body>

<!-- ════════ LOGIN SCREEN ════════ -->
<div id="login-screen">
  <div class="login-bg"></div>
  <div class="login-card">
    <div class="login-eyebrow">Private Access</div>
    <h1 class="login-title">VAULT</h1>
    <p class="login-sub">Your personal screening room</p>

    <div class="form-field">
      <label>Email Address</label>
      <input type="email" id="login-email" placeholder="you@example.com" autocomplete="email"/>
    </div>
    <div class="form-field">
      <label>Password</label>
      <input type="password" id="login-password" placeholder="••••••••••••" autocomplete="current-password"/>
    </div>
    <button class="btn-primary" id="login-btn" onclick="handleLogin()">
      <span id="login-btn-text">Enter Vault</span>
    </button>
    <div class="error-msg" id="login-error"></div>
  </div>
</div>

<!-- ════════ APP SCREEN ════════ -->
<div id="app-screen">
  <header class="topbar">
    <div class="topbar-logo">VAULT</div>
    <span class="topbar-count" id="video-count">— videos</span>
    <span class="topbar-email" id="user-email-display"></span>
    <button class="btn-add" onclick="openAddModal()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Add Video
    </button>
    <button class="btn-icon" title="Sign out" onclick="handleSignOut()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    </button>
  </header>

  <main class="main">
    <div class="section-header">
      <h2 class="section-title">Your <em>Collection</em></h2>
      <div class="section-line"></div>
    </div>

    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input class="search-input" type="text" id="search-input" placeholder="Search your collection…" oninput="filterVideos()"/>
    </div>

    <div class="video-grid" id="video-grid">
      <div class="empty-state">
        <div class="spinner"></div>
      </div>
    </div>
  </main>
</div>

<!-- ════════ ADD VIDEO MODAL ════════ -->
<div class="modal-overlay" id="add-modal">
  <div class="modal">
    <button class="modal-close" onclick="closeAddModal()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <h2 class="modal-title">Add Video</h2>
    <p class="modal-sub">Paste any YouTube, Vimeo, or direct video URL</p>

    <div class="form-field">
      <label>Title</label>
      <input type="text" id="video-title" placeholder="My favourite film…"/>
    </div>
    <div class="form-field">
      <label>Video URL</label>
      <input type="url" id="video-url" placeholder="https://youtube.com/watch?v=…" oninput="previewUrl()"/>
    </div>

    <div class="url-preview" id="url-preview">
      <div class="url-preview-icon">
        <svg id="preview-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      </div>
      <div class="url-preview-text">
        <div class="url-preview-type" id="preview-type">YouTube</div>
        <div class="url-preview-domain" id="preview-domain"></div>
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn-secondary" onclick="closeAddModal()">Cancel</button>
      <button class="btn-primary" onclick="addVideo()">
        <span id="add-btn-text">Save to Vault</span>
      </button>
    </div>
  </div>
</div>

<!-- ════════ PLAYER MODAL ════════ -->
<div class="player-overlay" id="player-overlay">
  <div class="player-header">
    <div class="player-title-wrap">
      <div class="player-title" id="player-title"></div>
      <div class="player-source" id="player-source"></div>
    </div>
    <button class="player-close" onclick="closePlayer()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <div class="player-box" id="player-box"></div>
</div>

<!-- ════════ TOAST ════════ -->
<div class="toast" id="toast"></div>

<!-- ════════ FIREBASE ════════ -->
<script type="module">
// ─── REPLACE THESE WITH YOUR FIREBASE CONFIG ───────────────────────────
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, doc, getDoc, addDoc, getDocs, deleteDoc, query, orderBy, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey:            "YOUR_API_KEY",
  authDomain:        "YOUR_PROJECT.firebaseapp.com",
  projectId:         "YOUR_PROJECT_ID",
  storageBucket:     "YOUR_PROJECT.appspot.com",
  messagingSenderId: "YOUR_SENDER_ID",
  appId:             "YOUR_APP_ID"
};

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

// ─── GLOBALS ──────────────────────────────────────────────────────────
let allVideos = [];
window._db   = db;
window._auth = auth;

// ─── AUTH STATE ───────────────────────────────────────────────────────
onAuthStateChanged(auth, async (user) => {
  if (user) {
    // Check if this email is in allowedUsers
    const allowed = await isEmailAllowed(user.email);
    if (!allowed) {
      await signOut(auth);
      showError("Access denied. This account is not authorised.");
      return;
    }
    showApp(user);
    loadVideos();
  } else {
    showLogin();
  }
});

// ─── CHECK ALLOWED EMAIL ──────────────────────────────────────────────
async function isEmailAllowed(email) {
  try {
    // Firestore doc: allowedUsers/{email}
    const snap = await getDoc(doc(db, "allowedUsers", email));
    return snap.exists();
  } catch (e) { return false; }
}

// ─── LOGIN ────────────────────────────────────────────────────────────
window.handleLogin = async () => {
  const email = document.getElementById("login-email").value.trim();
  const pass  = document.getElementById("login-password").value;
  const btn   = document.getElementById("login-btn");
  const txt   = document.getElementById("login-btn-text");

  if (!email || !pass) { showError("Please enter your email and password."); return; }

  btn.disabled = true;
  txt.innerHTML = '<span class="spinner" style="width:16px;height:16px;border-width:2px;vertical-align:middle"></span>';

  try {
    await signInWithEmailAndPassword(auth, email, pass);
  } catch (e) {
    btn.disabled = false;
    txt.textContent = "Enter Vault";
    const msgs = {
      "auth/user-not-found":    "No account found with this email.",
      "auth/wrong-password":    "Incorrect password.",
      "auth/invalid-email":     "Invalid email address.",
      "auth/too-many-requests": "Too many attempts. Please try again later.",
      "auth/invalid-credential":"Invalid email or password."
    };
    showError(msgs[e.code] || "Authentication failed.");
  }
};

// ─── SIGN OUT ─────────────────────────────────────────────────────────
window.handleSignOut = async () => { await signOut(auth); };

// ─── LOAD VIDEOS ──────────────────────────────────────────────────────
async function loadVideos() {
  const grid = document.getElementById("video-grid");
  grid.innerHTML = '<div class="empty-state"><div class="spinner"></div></div>';
  try {
    const q    = query(collection(db, "videos"), orderBy("createdAt", "desc"));
    const snap = await getDocs(q);
    allVideos  = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderVideos(allVideos);
  } catch(e) {
    grid.innerHTML = '<div class="empty-state"><p style="color:var(--red)">Failed to load. Check Firestore rules.</p></div>';
  }
}
window._loadVideos = loadVideos;

// ─── RENDER VIDEOS ────────────────────────────────────────────────────
function renderVideos(videos) {
  const grid = document.getElementById("video-grid");
  document.getElementById("video-count").textContent = `${videos.length} video${videos.length !== 1 ? 's' : ''}`;

  if (!videos.length) {
    grid.innerHTML = `
      <div class="empty-state">
        <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
          <rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/>
          <line x1="12" y1="17" x2="12" y2="21"/>
        </svg>
        <div class="empty-title">Your vault is empty</div>
        <div class="empty-sub">Add your first video by clicking "Add Video" above. Supports YouTube, Vimeo, and direct links.</div>
      </div>`;
    return;
  }

  grid.innerHTML = videos.map((v, i) => {
    const type   = detectVideoType(v.url);
    const thumb  = getThumb(v.url, type);
    const date   = v.createdAt?.toDate?.()?.toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' }) || '';
    const domain = getDomain(v.url);
    return `
      <div class="video-card" style="animation-delay:${i * 0.04}s" onclick="openPlayer('${v.id}')">
        <div class="card-thumb">
          ${thumb
            ? `<img src="${thumb}" alt="" loading="lazy" onerror="this.parentElement.innerHTML='${fallbackThumbHTML(type)}'"/>`
            : fallbackThumbHTML(type)
          }
          <div class="card-play-overlay">
            <div class="play-btn-circle">
              <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            </div>
          </div>
          <div class="card-source-badge">${type}</div>
        </div>
        <div class="card-body">
          <div class="card-title">${escHtml(v.title)}</div>
          <div class="card-url">${escHtml(domain)}</div>
          <div class="card-meta">
            <div class="card-date">${date}</div>
            <div class="card-actions" onclick="event.stopPropagation()">
              <button class="card-btn" title="Copy URL" onclick="copyUrl('${escHtml(v.url)}')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
              </button>
              <button class="card-btn delete" title="Delete" onclick="deleteVideo('${v.id}')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
              </button>
            </div>
          </div>
        </div>
      </div>`;
  }).join('');
}
window._renderVideos = renderVideos;

function fallbackThumbHTML(type) {
  return `<div class="card-thumb-fallback">
    <svg class="icon-play-big" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
    <span>${type}</span>
  </div>`;
}

// ─── ADD VIDEO ────────────────────────────────────────────────────────
window.addVideo = async () => {
  const title = document.getElementById("video-title").value.trim();
  const url   = document.getElementById("video-url").value.trim();
  const btn   = document.getElementById("add-btn-text");

  if (!title) { showToast("Please enter a title.", "error"); return; }
  if (!url || !isValidUrl(url)) { showToast("Please enter a valid URL.", "error"); return; }

  btn.innerHTML = '<span class="spinner" style="width:14px;height:14px;border-width:2px;vertical-align:middle"></span>';

  try {
    await addDoc(collection(db, "videos"), {
      title,
      url,
      createdAt: serverTimestamp()
    });
    closeAddModal();
    showToast("Video saved to vault.", "success");
    loadVideos();
  } catch(e) {
    showToast("Failed to save. Check Firestore rules.", "error");
  } finally {
    btn.textContent = "Save to Vault";
  }
};

// ─── DELETE VIDEO ─────────────────────────────────────────────────────
window.deleteVideo = async (id) => {
  if (!confirm("Remove this video from your vault?")) return;
  try {
    await deleteDoc(doc(db, "videos", id));
    showToast("Video removed.", "success");
    loadVideos();
  } catch(e) { showToast("Failed to delete.", "error"); }
};

// ─── PLAYER ───────────────────────────────────────────────────────────
window.openPlayer = (id) => {
  const video = allVideos.find(v => v.id === id);
  if (!video) return;

  const overlay = document.getElementById("player-overlay");
  const box     = document.getElementById("player-box");
  const type    = detectVideoType(video.url);
  const embed   = getEmbedUrl(video.url, type);

  document.getElementById("player-title").textContent  = video.title;
  document.getElementById("player-source").textContent = `${type} · ${getDomain(video.url)}`;

  if (type === "MP4/WebM") {
    box.innerHTML = `<video src="${video.url}" controls autoplay style="width:100%;height:100%;background:#000"></video>`;
    overlay.classList.add("open");
    document.body.style.overflow = "hidden";
  } else if (embed) {
    // Embeddable sources (YouTube, Vimeo, Dailymotion)
    box.innerHTML = `<iframe src="${embed}" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture" referrerpolicy="no-referrer-when-downgrade"></iframe>`;
    overlay.classList.add("open");
    document.body.style.overflow = "hidden";
  } else {
    // Any other website — open in a styled popup window (bypasses X-Frame-Options)
    openPopupPlayer(video.url, video.title);
  }
};

// Opens a real browser popup window — works for ANY website regardless of iframe restrictions
function openPopupPlayer(url, title) {
  const w = Math.min(1280, screen.width  - 80);
  const h = Math.min(800,  screen.height - 80);
  const x = Math.round((screen.width  - w) / 2);
  const y = Math.round((screen.height - h) / 2);

  const popup = window.open(
    url,
    `vault_player_${Date.now()}`,
    `width=${w},height=${h},left=${x},top=${y},toolbar=0,menubar=0,location=1,status=0,scrollbars=1,resizable=1`
  );

  if (!popup || popup.closed || typeof popup.closed === 'undefined') {
    // Popup was blocked — show the overlay with a manual open button
    const overlay = document.getElementById("player-overlay");
    const box     = document.getElementById("player-box");
    box.innerHTML = `
      <div class="player-error">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/><path d="M3 9h6"/>
        </svg>
        <p style="margin-bottom:6px">Popup was blocked by your browser.</p>
        <p style="font-size:11px;color:var(--text-muted);margin-bottom:16px">Allow popups for this site, then try again.</p>
        <a href="${url}" target="_blank" rel="noopener"
          style="background:var(--gold);color:#000;padding:10px 22px;border-radius:4px;font-size:11px;letter-spacing:0.12em;text-transform:uppercase;text-decoration:none;font-family:'DM Mono',monospace">
          Open in New Tab →
        </a>
      </div>`;
    overlay.classList.add("open");
    document.body.style.overflow = "hidden";
  } else {
    popup.focus();
    showToast("Opened in popup window.", "success");
  }
}

window.closePlayer = () => {
  document.getElementById("player-overlay").classList.remove("open");
  document.getElementById("player-box").innerHTML = "";
  document.body.style.overflow = "";
};

// ─── URL UTILS ────────────────────────────────────────────────────────
function detectVideoType(url) {
  if (!url) return "Unknown";
  if (/youtube\.com|youtu\.be/.test(url))  return "YouTube";
  if (/vimeo\.com/.test(url))              return "Vimeo";
  if (/dailymotion\.com/.test(url))        return "Dailymotion";
  if (/twitch\.tv/.test(url))              return "Twitch";
  if (/\.(mp4|webm|ogv)(\?|$)/i.test(url)) return "MP4/WebM";
  if (/facebook\.com/.test(url))           return "Facebook";
  if (/instagram\.com/.test(url))          return "Instagram";
  if (/tiktok\.com/.test(url))             return "TikTok";
  return "Web";
}

function getYouTubeId(url) {
  const m = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([^&?#\s]{11})/);
  return m ? m[1] : null;
}

function getVimeoId(url) {
  const m = url.match(/vimeo\.com\/(?:video\/)?(\d+)/);
  return m ? m[1] : null;
}

function getDailymotionId(url) {
  const m = url.match(/dailymotion\.com\/video\/([a-zA-Z0-9]+)/);
  return m ? m[1] : null;
}

function getEmbedUrl(url, type) {
  if (type === "YouTube") {
    const id = getYouTubeId(url);
    return id ? `https://www.youtube.com/embed/${id}?autoplay=1&rel=0` : null;
  }
  if (type === "Vimeo") {
    const id = getVimeoId(url);
    return id ? `https://player.vimeo.com/video/${id}?autoplay=1` : null;
  }
  if (type === "Dailymotion") {
    const id = getDailymotionId(url);
    return id ? `https://www.dailymotion.com/embed/video/${id}?autoplay=1` : null;
  }
  return null;
}

function getThumb(url, type) {
  if (type === "YouTube") {
    const id = getYouTubeId(url);
    return id ? `https://img.youtube.com/vi/${id}/hqdefault.jpg` : null;
  }
  return null;
}

function getDomain(url) {
  try { return new URL(url).hostname.replace('www.', ''); } catch { return url; }
}

function isValidUrl(url) {
  try { new URL(url); return true; } catch { return false; }
}

// ─── SEARCH ───────────────────────────────────────────────────────────
window.filterVideos = () => {
  const q = document.getElementById("search-input").value.toLowerCase();
  const filtered = allVideos.filter(v =>
    v.title.toLowerCase().includes(q) || v.url.toLowerCase().includes(q)
  );
  renderVideos(filtered);
};

// ─── URL PREVIEW ──────────────────────────────────────────────────────
window.previewUrl = () => {
  const url  = document.getElementById("video-url").value.trim();
  const prev = document.getElementById("url-preview");
  if (!url || !isValidUrl(url)) { prev.classList.remove("show"); return; }
  const type = detectVideoType(url);
  document.getElementById("preview-type").textContent   = type;
  document.getElementById("preview-domain").textContent = getDomain(url);
  prev.classList.add("show");
};

// ─── COPY URL ─────────────────────────────────────────────────────────
window.copyUrl = (url) => {
  navigator.clipboard.writeText(url).then(() => showToast("URL copied.", "success"));
};

// ─── MODAL HELPERS ────────────────────────────────────────────────────
window.openAddModal = () => {
  document.getElementById("add-modal").classList.add("open");
  document.getElementById("video-title").value = "";
  document.getElementById("video-url").value   = "";
  document.getElementById("url-preview").classList.remove("show");
  setTimeout(() => document.getElementById("video-title").focus(), 100);
};
window.closeAddModal = () => document.getElementById("add-modal").classList.remove("open");

// ─── UI STATE ─────────────────────────────────────────────────────────
function showApp(user) {
  document.getElementById("login-screen").style.display = "none";
  document.getElementById("app-screen").classList.add("active");
  document.getElementById("user-email-display").textContent = user.email;
}
function showLogin() {
  document.getElementById("login-screen").style.display = "flex";
  document.getElementById("app-screen").classList.remove("active");
  document.getElementById("login-btn").disabled = false;
  document.getElementById("login-btn-text").textContent = "Enter Vault";
}
function showError(msg) {
  const el = document.getElementById("login-error");
  el.textContent = msg;
  el.classList.add("show");
}

// ─── TOAST ────────────────────────────────────────────────────────────
let toastTimer;
window.showToast = (msg, type = "") => {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className   = `toast show ${type}`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.className = "toast", 3000);
};

// ─── ESCAPE HTML ──────────────────────────────────────────────────────
function escHtml(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

// ─── KEYBOARD ─────────────────────────────────────────────────────────
document.addEventListener("keydown", e => {
  if (e.key === "Escape") {
    closePlayer();
    closeAddModal();
  }
  if (e.key === "Enter" && document.getElementById("login-screen").style.display !== "none") {
    handleLogin();
  }
});

// Close modals on overlay click
document.getElementById("add-modal").addEventListener("click", e => {
  if (e.target === e.currentTarget) closeAddModal();
});
document.getElementById("player-overlay").addEventListener("click", e => {
  if (e.target === e.currentTarget) closePlayer();
});
</script>
</body>
</html>
